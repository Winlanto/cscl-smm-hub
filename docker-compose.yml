services:
  postgres:
    image: postgres:17-alpine
    container_name: cscl-smm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cscl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cscl_password}
      POSTGRES_DB: ${POSTGRES_DB:-cscl_smm_hub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cscl_admin} -d $${POSTGRES_DB:-cscl_smm_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  postgres_data:
    driver: local